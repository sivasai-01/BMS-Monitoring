name: BMS Ticket Checker

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ Install system dependencies (VERY IMPORTANT)
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            xvfb \
            libxi6 \
            libgconf-2-4 \
            libnss3 \
            libxss1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm-dev

      # ✅ Install Python dependencies
      - name: Install Python packages
        run: |
          pip install selenium requests

      # ✅ Run script using virtual display
      - name: Run Selenium script
        run: |
          xvfb-run --auto-servernum python bms.py
